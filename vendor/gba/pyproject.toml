[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gba-construction-sim"
version = "0.1.0"
description = "Greater Bay Area construction cooperation multi-agent simulation MVP"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=1.10",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["gba_construction_sim/backend/tests"]
filterwarnings = [
    "ignore:The `dict` method is deprecated:DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["gba_construction_sim*"]
exclude = ["camel_ai_docs*"]
